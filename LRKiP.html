<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08a9df"><title>Лабораторная работа · Изменение механической энергии</title>
<style>
:root{--blue:#08a9df;--dark:#087ca8;--ink:#202326;--muted:#677178;--line:#d8e0e4;--wash:#f4f8fa;--pale:#dff5fc;--grey:#e2e2e2;--shadow:0 18px 60px #22364312}
*{box-sizing:border-box}body{margin:0;background:#edf2f4;color:var(--ink);font:16px/1.5 Georgia,"Times New Roman",serif}.page{max-width:1060px;margin:34px auto;background:#fff;box-shadow:var(--shadow);padding:38px 54px 46px}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted);font:600 12px/1.3 Arial,sans-serif;text-transform:uppercase;letter-spacing:.09em;margin-bottom:20px}.titlebar{display:grid;grid-template-columns:92px 1fr;margin-bottom:22px}.number{display:grid;place-items:center;background:var(--blue);color:#fff;font:800 27px/1 Arial,sans-serif;min-height:76px}h1{margin:0;background:var(--grey);padding:14px 26px;display:flex;align-items:center;font:800 clamp(20px,3vw,27px)/1.12 Arial,sans-serif;text-transform:uppercase}.lead{font-size:19px;margin:0 0 26px;color:#41484c}
.meta{display:grid;grid-template-columns:160px 1fr;gap:12px 18px;margin:0 0 30px}.meta dt{font:700 14px/1.25 Arial,sans-serif}.meta dd{margin:0;font-size:19px;line-height:1.35}.section-ribbon{display:inline-block;margin:0 0 16px;background:var(--blue);color:#fff;padding:5px 12px;font:800 14px/1.1 Arial,sans-serif;letter-spacing:.045em;text-transform:uppercase}
.steps{list-style:none;counter-reset:step;padding:0;margin:0 0 29px}.steps li{counter-increment:step;display:grid;grid-template-columns:30px 1fr;gap:12px;margin:0 0 14px;font-size:19px;line-height:1.35}.steps li:before{content:counter(step) ".";color:var(--blue);font:800 18px/1.45 Arial,sans-serif;text-align:right}.step-text{display:block}.note{background:#f5fbfd;border-left:4px solid var(--blue);padding:13px 16px;margin:22px 0 30px;color:#35444b;font-size:16px}.formula{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:16px 20px;margin:14px 0 24px;background:var(--pale);font-size:20px}.formula b{font-size:21px;color:var(--dark)}.formula small{font:14px/1.4 Arial,sans-serif;color:#52636a}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:4px;margin:12px 0}.table-wrap table{border-collapse:collapse;width:100%;min-width:760px}th{background:#dff5fc;font:700 14px/1.3 Arial,sans-serif;text-align:center;padding:11px 9px;border:1px solid #fff;vertical-align:middle}td{padding:8px;border:1px solid var(--line);text-align:center;background:#fff}tbody tr:nth-child(even) td{background:#f6fbfd}td input{width:100%;min-width:72px;border:1px solid #cad7dc;border-radius:4px;background:#fff;padding:8px;text-align:center;color:var(--ink);font:16px Georgia,serif}td input:focus{outline:2px solid #81d9f4;border-color:var(--blue)}.trial{font:700 15px Arial,sans-serif;color:var(--dark)}.calc{font-weight:700;color:#123847}.subhead{margin-top:28px}.small{font:12px/1.3 Arial,sans-serif;color:var(--muted)}
.table-foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font:13px/1.4 Arial,sans-serif}.actions{display:flex;gap:8px;flex-wrap:wrap}.button{border:1px solid #b8c9cf;background:#fff;color:#25343a;border-radius:5px;padding:9px 13px;cursor:pointer;font:700 13px Arial,sans-serif}.button:hover{border-color:var(--blue);color:var(--dark)}.danger{border-color:#e2c6c6;color:#9b4141}
.massbox{display:flex;align-items:center;gap:16px;padding:14px 18px;background:var(--wash);border:1px solid var(--line);margin:12px 0 18px}.massbox label{font:700 15px/1.35 Arial,sans-serif}.massbox input{width:160px;border:1px solid #cad7dc;border-radius:4px;padding:9px;text-align:center;font:17px Georgia,serif}.massbox input:focus{outline:2px solid #81d9f4;border-color:var(--blue)}
.conclusion{border:1px solid var(--line);background:var(--wash);padding:18px 20px;margin:18px 0 28px}.conclusion-label{font:800 14px Arial,sans-serif;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}.conclusion p{font-size:18px;margin:0;min-height:52px}.prompt{font:14px Arial,sans-serif;color:var(--muted);margin-top:9px!important}.footer{margin-top:40px;padding-top:10px;border-top:4px solid var(--blue);display:flex;justify-content:space-between;color:var(--muted);font:12px Arial,sans-serif}.source a{color:var(--dark)}

/* Стили интерактивной установки */
.lab-simulator{border:1px solid var(--line);background:var(--wash);padding:20px;margin:24px 0;border-radius:6px}
.sim-container{position:relative;width:100%;height:260px;background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-bottom:16px}
.sim-controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:16px}
.sim-control-group{display:flex;flex-direction:column;gap:6px}
.sim-control-group label{font:700 13px Arial,sans-serif;color:var(--dark)}
.sim-control-group input[type="range"]{width:100%;cursor:pointer}
.sim-panel-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;background:var(--pale);padding:12px 16px;border-radius:4px;font-size:15px}
.sim-btn{background:var(--blue);color:#fff;border:none;border-radius:4px;padding:10px 18px;font:700 14px Arial,sans-serif;cursor:pointer}
.sim-btn:hover{background:var(--dark)}
.sim-btn:disabled{background:var(--muted);cursor:not-allowed}

@media(max-width:720px){.page{margin:0;padding:24px 18px 34px}.titlebar{grid-template-columns:66px 1fr}.number{min-height:70px;font-size:21px}h1{padding:12px 15px;font-size:20px}.meta{grid-template-columns:1fr;gap:5px;margin-bottom:24px}.meta dd{margin-bottom:10px}.steps li{grid-template-columns:26px 1fr;font-size:17px}.formula{font-size:18px;padding:13px}.massbox{align-items:stretch;flex-direction:column;gap:8px}.massbox input{width:100%}.footer{gap:12px;flex-wrap:wrap}.topline{align-items:flex-start;flex-direction:column}}
@media print{body{background:#fff}.page{max-width:none;margin:0;box-shadow:none;padding:12mm;min-height:auto}.actions,.save-status,.lab-simulator
