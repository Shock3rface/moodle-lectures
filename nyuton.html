<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ньютон</title>
<style>
:root{--bg:#1B2233;--surface:#232C42;--text:#E7EAF2;--muted:#9AA3BC;--heading:#EDEFF6;--accent:#4FA3C4;--accent2:#D68A4C;--border:#333E5C;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;width:100%;overflow-x:hidden;}
body{background-color:var(--bg);color:var(--text);font-family:system-ui, -apple-system, 'Segoe UI', sans-serif;line-height:1.65;-webkit-text-size-adjust:100%;}
.page-container{width:100%;max-width:1400px;margin:0 auto;padding:40px 24px 72px;box-sizing:border-box;}
.page-container::after{content:"";display:table;clear:both;}
html.in-iframe .page-container{padding:20px 16px 36px;}
h1,h2,h3{font-family:'Trebuchet MS', system-ui, sans-serif;color:var(--heading);line-height:1.25;margin:0 0 10px;}
.block{width:100%;max-width:100%;box-sizing:border-box;margin:0 0 40px;}
.caption{font-size:14px;color:var(--muted);margin-top:10px;font-style:italic;text-align:center;}
.block-title{border-bottom:3px solid var(--accent);padding-bottom:22px;}
.block-title h1{font-size:clamp(28px,5vw,40px);margin-bottom:8px;}
.block-title .subheading{font-size:18px;color:var(--muted);margin:0;}
.block-text h2{font-size:23px;}
.block-text p{margin:0 0 14px;}
.block-image{text-align:center;}
.block-image img{max-width:100%;height:auto;border-radius:10px;display:block;margin:0 auto;}
.block-image.size-medium img{max-width:60%;}
.block-image.align-left:not(.size-medium){text-align:left;}
.block-image.align-right:not(.size-medium){text-align:right;}
.block-image.align-left:not(.size-medium) img{margin:0 auto 0 0;}
.block-image.align-right:not(.size-medium) img{margin:0 0 0 auto;}
.block-image.size-medium.align-left{float:left;width:42%;margin:0 24px 20px 0;text-align:left;}
.block-image.size-medium.align-right{float:right;width:42%;margin:0 0 20px 24px;text-align:right;}
.block-image.size-medium.align-left img,.block-image.size-medium.align-right img{max-width:100%;margin:0;}
.block-cards h2{font-size:23px;margin-bottom:16px;}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;}
.card .card-icon{font-size:28px;margin-bottom:8px;display:block;}
.card h3{font-size:18px;margin:0 0 6px;color:var(--heading);}
.card p{margin:0;color:var(--muted);font-size:15px;}
.block-table h2{font-size:23px;margin-bottom:16px;}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:8px;}
table{width:100%;border-collapse:collapse;background:var(--surface);}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--border);font-size:15px;}
th{background:var(--heading);color:var(--surface);font-family:'Trebuchet MS', system-ui, sans-serif;font-weight:600;}
tr:last-child td{border-bottom:none;}
.block-task{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:8px;padding:20px;}
.block-task .task-question{font-weight:600;margin:0 0 14px;}
.task-toggle{background:var(--accent);color:#fff;border:none;padding:9px 18px;border-radius:6px;cursor:pointer;font-size:14px;font-weight:600;}
.task-toggle:hover{opacity:.9;}
.task-answer{margin-top:14px;padding-top:14px;border-top:1px dashed var(--border);display:none;}
.task-answer.open{display:block;}
.interactive-container{width:100%;box-sizing:border-box;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;overflow:auto;}
.interactive-container canvas,.interactive-container svg,.interactive-container img{max-width:100%;height:auto;}
.block-task-custom{border-left:4px solid var(--accent);border-radius:8px;}
.block-task-custom .interactive-container{border:none;border-radius:0 8px 8px 0;}
.block-model3d{text-align:center;width:100%;}
.block-model3d.align-left{text-align:left;}
.block-model3d.align-right{text-align:right;}
.model3d-wrap{margin:0 auto;width:100%;max-width:100%;box-sizing:border-box;}
.block-model3d.align-left .model3d-wrap{margin:0 auto 0 0;}
.block-model3d.align-right .model3d-wrap{margin:0 0 0 auto;}
.model3d-frame{width:100%;display:block;border-radius:8px;border:1px solid var(--border);}
strong{color:var(--heading);}
@media(max-width:640px){.page-container{padding:28px 16px 48px;}.cards-grid{grid-template-columns:1fr;}.block-image.size-medium img{max-width:100%;}.block-image.size-medium.align-left,.block-image.size-medium.align-right{float:none;width:100%;margin:0 0 16px;text-align:center;}th,td{padding:9px 10px;font-size:14px;}}
body{background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2272%22%20height%3D%2272%22%20viewBox%3D%220%200%2072%2072%22%3E%3Cpath%20d%3D%22M4%2036%20Q14%2016%2024%2036%20T44%2036%20T64%2036%22%20fill%3D%22none%22%20stroke%3D%22rgba(237%2C239%2C246%2C0.07)%22%20stroke-width%3D%222%22%2F%3E%3Ccircle%20cx%3D%2260%22%20cy%3D%2218%22%20r%3D%224%22%20fill%3D%22none%22%20stroke%3D%22rgba(237%2C239%2C246%2C0.07)%22%20stroke-width%3D%221.5%22%2F%3E%3C%2Fsvg%3E");background-repeat:repeat;background-size:72px 72px;}
</style>
</head>
<body>
<script>try{if(window.self!==window.top){document.documentElement.classList.add('in-iframe');}}catch(e){document.documentElement.classList.add('in-iframe');}</script>
<main class="page-container">
<div class="block block-title"><h1>Законы Ньютона</h1><p class="subheading">Крутоклассноинтересновау</p></div>
<div class="block block-text"><p style="font-weight:400;font-style:normal;text-decoration:none">Это пример текстового блока. Отредактируйте его или удалите, начав свою страницу с чистого листа.</p></div>
<div class="block block-model3d align-center"><div class="model3d-wrap"><iframe class="model3d-frame" src="https://sketchfab.com/models/1351f71d50244ec69d7acc51799582e7/embed" style="width:100%;border:0;aspect-ratio:16/9;" allow="autoplay; fullscreen; xr-spatial-tracking" allowfullscreen loading="lazy"></iframe></div></div>
</main>
<script>
   function resizeIframe(){

    const body = document.body;
    const html = document.documentElement;

    const height = Math.max(
        body.getBoundingClientRect().height,
        body.scrollHeight,
        html.scrollHeight
    );

    window.parent.postMessage({
        type:"resizeIframe",
        height: Math.ceil(height)
    }, "*");
}


window.addEventListener("load", resizeIframe);

window.addEventListener("resize", resizeIframe);

setTimeout(resizeIframe,1000);

setTimeout(resizeIframe,3000);

new ResizeObserver(resizeIframe)
.observe(document.body);
</script>
</body>
</html>
